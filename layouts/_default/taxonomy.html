{{ define "main" }}
  <div
    class="archive {{ with .Site.Params.doNotLoadAnimations }}
      .
    {{ else }}
      animated fadeInDown
    {{ end }}"
  >
    <div class="archive__heading">{{ .Title }}</div>
    {{ $terms := .Pages.ByTitle }}
    {{ if eq .Data.Plural "series" }}
      {{ $terms = .Pages.ByDate.Reverse }}
    {{ end }}
    {{ range $terms }}
      <ul class="archive__list">
        <li class="archive__list-item">
          <a class="archive__list-title" href="{{ .RelPermalink }}" title="{{ .Title }}">{{ .Title }}</a>
          <div class="archive__list-date">{{ len .Pages }} {{ cond (eq (len .Pages) 1) "post" "posts" }}</div>
        </li>
      </ul>
    {{ end }}
  </div>
{{ end }}
