name: Build website

on:
  push:
    branches: [ 'master' ]
    tags: [ 'v*.*', 'v*.*.*', 'v*.*.*-*' ]
  pull_request:

env:
  HUGO_VERSION: '0.167.0'
  DART_SASS_VERSION: '1.105.1'

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      # Go is required to fetch the theme as a Hugo module
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # The Anatole theme compiles its SCSS with Dart Sass
      - name: Setup Dart Sass
        run: |
          curl -sL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --minify

      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: public/

      # prepare release
      - name: create artifact archive
        run: tar -zcf 'public.tar.gz' public/

      ## release (when tag present)
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public.tar.gz
          fail_on_unmatched_files: true
        if: startsWith(github.ref, 'refs/tags/')
